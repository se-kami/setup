name: Dotfiles

on:
  push:
    paths:
      - 'config/**'
      - 'stow.sh'
      - 'tests/**'
      - '.github/workflows/stow.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'stow.sh'
      - 'tests/**'
      - '.github/workflows/stow.yml'

permissions:
  contents: read

jobs:
  stow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y stow zsh lua5.4
      - name: Test links in temporary home directories
        run: python3 -m unittest discover -s tests -v
      - name: Check shell and Lua syntax
        run: |
          bash -n stow.sh
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for path in Path('config/nvim').rglob('*.lua'):
              subprocess.run(['luac5.4', '-p', str(path)], check=True)
          for name in ('.zshenv', '.config/env', '.config/aliasrc', '.config/fnrc', '.config/zsh/.zshrc', '.config/zsh/.zprofile'):
              subprocess.run(['zsh', '-f', '-n', str(Path('config/zsh') / name)], check=True)
          PY
